<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>carmona perez marino — arquitectura</title>
  <link rel="stylesheet" href="css/styles3.css" />
</head>
<body>

  <!-- Header fixed -->
  <header id="header" class="header">
    <div class="header-logo">
      <span class="logo-text" id="logoText">
        <span></span>
        <span></span>
      </span>
    </div>
    <nav class="header-nav">
      <button class="nav-item active" data-section="obras">Obras</button>
      <button class="nav-item" data-section="estudio">Estudio</button>
    </nav>
  </header>

  <!-- OBRAS: Slider -->
  <div id="obras" class="page page--active">
    <!-- Progress dots -->
    <div id="progress" class="progress"></div>

    <!-- Flechas de navegación -->
    <button class="arrow arrow-left" id="arrowLeft" aria-label="Proyecto anterior">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>
    <button class="arrow arrow-right" id="arrowRight" aria-label="Proyecto siguiente">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>

    <div id="slider">
      <section class="slide" data-index="0" style="background-image: url('img/casa-bosque/3.jpg');">
        <h2 class="slide-title"><span class="title-light">Casa</span> <span class="title-bold">Bosque</span></h2>
      </section>
      <section class="slide" data-index="1" style="background-image: url('img/casa-san-benito/3.jpg');">
        <h2 class="slide-title"><span class="title-light">Casa</span> <span class="title-bold">San Benito</span></h2>
      </section>
      <section class="slide" data-index="2" style="background-image: url('img/edificio-varese-ii/1.jpg');">
        <h2 class="slide-title"><span class="title-light">Edificio</span> <span class="title-bold">Varese II</span></h2>
      </section>
      <section class="slide" data-index="3" style="background-image: url('img/obra-bunker/1.jpg');">
        <h2 class="slide-title"><span class="title-light">Obra</span> <span class="title-bold">Bunker</span></h2>
      </section>
    </div>

    <!-- Proyecto detalle -->
    <div id="project-detail" class="project-detail" style="display:none;">
      <button id="btnBackToWorks" class="btn-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
        Volver a obras
      </button>
      <h2 id="projectTitle" class="project-detail-title"></h2>

      <div class="project-detail-images">
        <div id="detailSlider" class="detail-slider"></div>
      </div>

      <div class="project-detail-info">
        <p id="projectDescription" class="project-description"></p>
      </div>
    </div>
  </div>

  <!-- ESTUDIO -->
  <div id="estudio" class="page">
    <div class="estudio-container">
      <div class="estudio-fixed">
        <img src="img/estudio/main.jpg" alt="Estudio carmona perez marino" class="estudio-main-image" />
        <div class="estudio-text">
          <h2><span class="title-light">Estudio</span> <span class="title-bold">CPM</span></h2>
          <p>carmona perez marino nace del encuentro de tres miradas sobre una misma idea: que la arquitectura no se trata de objetos, sino de la vida que ocurre dentro de ellos.</p>
        </div>
      </div>
      <div class="estudio-carousel-container">
        <div class="estudio-carousel" id="estudioCarousel"></div>
      </div>
    </div>
  </div>

  <script src="js/main3.js"></script>

  <!-- FOOTER GLOBAL -->

    <div class="footer-content">
      <a href="https://wa.me/5491234567890" target="_blank" class="footer-icon" aria-label="WhatsApp">

      </a>

          <rect x="2" y="4" width="20" height="16" rx="2"></rect>
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>

</body>
</html>
